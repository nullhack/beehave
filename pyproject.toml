[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beehave"
version = "2.1.0"
description = "A thin layer on Hypothesis for Gherkin-style BDD testing with vocabulary enforcement"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "eol", email = "nullhack@users.noreply.github.com" }
]
dependencies = [
    "gherkin-official>=39.0",
]

[project.scripts]
beehave = "beehave.cli:main"

[dependency-groups]
dev = [
    "agents-smith>=1.0.0",
    "beehave",
    "flowr[viz]>=1.1.0",
    "hypothesis>=6.152.7",
    "mypy>=2.3.0",
    "pytest>=8.0",
    "ruff>=0.11",
    "taskipy>=1.14.1",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.uv.sources]
beehave = { workspace = true }

[tool.mypy]
python_version = "3.14"
strict = true

[tool.taskipy.tasks]
test = "pytest"
test-fast = "pytest -x -q"
lint = "ruff check ."
lint-merge = "ruff check --select E,F,W,I,N,UP,B,SIM,RUF --preview . && ruff format --check ."
stubtest = "python -m mypy.stubtest beehave --allowlist .stubtest_allowlist"
